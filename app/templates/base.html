<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACS 2.0 | Intelligent Academic Communication & Intervention System</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #F4F6F8;
    margin: 0;
}

header {
    background: linear-gradient(90deg, #004E64, #2C7DA0);
    color: white;
    padding: 20px 40px;
    font-size: 22px;
    font-weight: 600;
}

.container {
    padding: 30px 40px;
}

.dashboard-cards {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    flex: 1;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.card h3 {
    margin: 0;
    font-size: 14px;
    color: #777;
}

.card p {
    font-size: 26px;
    margin: 10px 0 0;
    font-weight: bold;
}

.low { color: green; }
.medium { color: orange; }
.high { color: red; }

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #eee;
}

th {
    background: #E9F1F5;
    text-align: left;
}

details summary {
    cursor: pointer;
    font-weight: 500;
}
</style>

</head>
<body>

<nav style="
    background: linear-gradient(90deg, #0a1f44, #0f2a5f);
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    position: sticky;
    top: 0;
    z-index: 9999;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
">

  <div style="font-size: 22px; font-weight: bold;">
    ACS 2.0
  </div>

  <div style="display: flex; gap: 24px; align-items: center;">
    <a href="/" style="color:white; text-decoration:none; font-weight:500;">Home</a>
    <a href="/attendance/approval" style="color:white; text-decoration:none; font-weight:500;">Approvals</a>
    <a href="/communication/preview" style="color:white; text-decoration:none; font-weight:500;">Communication</a>
    <a href="/logs" style="color:white; text-decoration:none; font-weight:500;">Logs</a>

    <a href="/logout"
       style="
         color: white;
         text-decoration: none;
         padding: 8px 18px;
         border: 1px solid white;
         border-radius: 8px;
         font-weight: 500;
       ">
       Logout
    </a>
  </div>

</nav>

<header>
    <h1>ACS+ | Personalized Academic Learning Path System</h1>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
